plugins {
    id 'net.fabricmc.fabric-loom' version "1.18.+"

    id 'com.oroarmor.general-gradle-plugin' version '1.3.1'
    id 'com.oroarmor.minecraft-gradle-plugin' version '1.3.1'
}

version = project.mod_version
group = project.maven_group

repositories {
    maven {
        name = "OroArmor"
        url = "https://maven.oroarmor.com"
    }
    maven {
        name = "Jitpack"
        url = 'https://jitpack.io'
    }
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/releases/"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven { url 'https://repo.sleeping.town/' }
}

oroarmor {
    name = "Netherite-Plus-Mod"
    githubProjectName = "OroArmorModding/Netherite-Plus-Mod"
    description = "This mod adds extra netherite features that aren't vanilla.\n\nNOTE: Editing the config requires a game restart."

    println(projectPublishing.changelog.get())
}

import com.oroarmor.orogradleplugin.minecraft.dependency.ModDependency.DependencyType
minecraftPublishing {
    gameVersions = ["26.3"]
    modrinthId = "MlaM22M4"
    curseforgeId = "394120"
    dependencies {
        "ranged-weapon-api" {
            version = project.ranged_weapon_api_version
            type = DependencyType.REQUIRED
        }
        "fabric-api" {
            version = project.fabric_api_version
            type = DependencyType.REQUIRED
        }
    }
    loaders = ["Fabric"]
    modTask = jar
}

license {
    exclude '**/*.accesswidener'
}

loom {
    accessWidenerPath = file("src/main/resources/netherite_plus.accesswidener")

    splitEnvironmentSourceSets()

    mods {
        "netherite_plus_mod" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureDataGeneration() {
        client = true
        strictValidation = true
        createRunConfiguration = true
        createSourceSet = true
        modId = "netherite_plus"
        outputDirectory = file("src/datagen/resources")
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    implementation "folk.sisby:kaleido-config:${project.kaleido_config_version}"
    include "folk.sisby:kaleido-config:${project.kaleido_config_version}"

    implementation "maven.modrinth:ranged-weapon-api:${project.ranged_weapon_api_version}"
}

processResources {
    inputs.property "version", version

    filesMatching('fabric.mod.json') {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25

    withSourcesJar()
}

jar {
    def projectName = project.name
    inputs.property "projectName", projectName

    from("LICENSE") {
        rename { "${it}_${project.name}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            oroarmor.generateDefaultPom(it)
        }
    }

    repositories {
        mavenLocal()
    }
}

import com.oroarmor.orogradleplugin.publish.PublishProjectToGithubTask
tasks.register("github", PublishProjectToGithubTask) {
    assets.from(jar, sourcesJar)
}

import com.oroarmor.orogradleplugin.minecraft.*
//tasks.register("curseforge", CurseforgePublishTask)
tasks.register("modrinth", ModrinthPublishTask)
